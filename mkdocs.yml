site_name: OSS26_FruitNinja

site_url: https://asimov-archive.github.io/OSS26_FruitNinja/

theme:
  name: material

nav:
  - Home: index.md
  - Proposal: proposal.md
  - Team rules: team-rules.md
  - API: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google